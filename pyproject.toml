[project]
name = "edip"
version = "0.0.1"
description = "Energy Decision Intelligence Platform: battery dispatch decisions with bounded agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
]

[project.optional-dependencies]
# Databricks, model client, app, and Lakebase. Jobs install only what they need.
platform = [
    "databricks-openai==0.17.1",
    "databricks-sdk==0.152.0",
    "fastapi==0.143.0",
    "mlflow-skinny==3.17.1",
    "psycopg[binary]==3.3.6",
    "uvicorn==0.54.0",
]
# Gate 2 forecasting: LightGBM models and ONNX export for the browser sandbox.
forecasting = [
    "lightgbm==4.7.0",
    "onnx==1.17.0",  # newer onnx needs protobuf 6, which breaks the Databricks runtime MLflow
    "onnxmltools==1.16.0",
    "onnxruntime==1.31.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "hypothesis==6.169.1", "pytest==9.1.1", "ruff==0.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edip"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "explainer"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
