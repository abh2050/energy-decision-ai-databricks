# Lakebase Autoscaling: smallest compute range, suspends to zero after 5 idle minutes,
# shortest history retention. Compute is not billed while suspended.
resources:
  postgres_projects:
    edip_lakebase:
      project_id: edip-lakebase
      display_name: edip-lakebase
      pg_version: 17
      history_retention_duration: 86400s
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 1
        suspend_timeout_duration: 300s
      custom_tags:
        - key: project
          value: edip
