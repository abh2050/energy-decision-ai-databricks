# Gate 1 ingest on serverless compute; no schedule.
resources:
  jobs:
    gate1_ingest:
      name: edip-gate1-ingest
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest
          spark_python_task:
            python_file: ../src/edip/data/ingest_job.py
            parameters: ["--config", "${workspace.file_path}/config/data.yaml"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - ../dist/*.whl
