# Catalog `edip` uses Databricks-managed storage; scripts/create_catalog.py creates it once.
resources:
  schemas:
    raw:
      catalog_name: ${var.catalog}
      name: raw
      comment: Immutable source snapshots (UCI load data, tariff documents).
    curated:
      catalog_name: ${var.catalog}
      name: curated
      comment: Cleaned load observations, forecasts, dispatch and settlement outcomes.
    ml:
      catalog_name: ${var.catalog}
      name: ml
      comment: Registered forecasting models and features.
    eval:
      catalog_name: ${var.catalog}
      name: eval
      comment: Sensitivity grid and agent evaluations.

  volumes:
    raw_snapshots:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.raw.name}
      name: snapshots
      volume_type: MANAGED
      comment: Dated, hashed source file snapshots (FR1).
