# Records package versions of serverless environment client 4 (no extra dependencies).
resources:
  jobs:
    runtime_probe:
      name: edip-runtime-probe
      tasks:
        - task_key: probe
          spark_python_task:
            python_file: ../scripts/runtime_versions.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "4"
