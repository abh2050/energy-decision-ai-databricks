name: pages

# Deploy the website (presentation at the root, browser app at /app/) to GitHub Pages after the
# same scan and tests as CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build
        working-directory: frontend
        run: npx tsc -b && npx vite build --config vite.pages.config.ts && mv ../site/pages.html ../site/index.html
      - name: Fail if a public bundle contains a workspace URL, token, or email
        run: uv run python scripts/scan_public_bundle.py site
      - name: Public pages with the network blocked
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.public.config.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
