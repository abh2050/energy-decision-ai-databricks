name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Workspace URL, token, and email scan
        run: uv run python scripts/scan_public_bundle.py .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Type check and build the live app
        run: npx tsc -b && npx vite build
        working-directory: frontend
      - name: Playwright (live app on a synthetic snapshot, no cloud, no model calls)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          uv run python ../tests/fixture_data.py "$RUNNER_TEMP/fixture_data"
          EDIP_DATA_DIR="$RUNNER_TEMP/fixture_data" npx playwright test
      - name: Build the public pages
        working-directory: frontend
        run: npx vite build --config vite.pages.config.ts && mv ../site/pages.html ../site/index.html
      - name: Fail if a public bundle contains a workspace URL, token, or email
        run: uv run python scripts/scan_public_bundle.py site
      - name: Website and app with the network blocked (presentation, app, parity)
        working-directory: frontend
        run: npx playwright test --config playwright.public.config.ts

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
