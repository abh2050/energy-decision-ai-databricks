# Databricks serverless runtime used by the bundle jobs, recorded by the
# edip-runtime-probe job (scripts/runtime_versions.py) on 2026-10-14.
serverless_environment_client: "4"
python: 3.12.3
preinstalled:
  mlflow-skinny: 2.22.0
  protobuf: 5.29.4
  pyspark: 4.0.0+databricks.connect.17.3.14
  pandas: 2.2.3
  numpy: 2.1.3
  pydantic: 2.10.6
job_pins:  # pinned in every data and ML job environment spec (resources/*.yml)
  mlflow-skinny: 2.22.0
  protobuf: 5.29.4
notes:
  - The project wheel pins pandas 2.3.3 and numpy 2.3.5, so pip upgrades those two in
    the job environment; MLflow and protobuf stay at the runtime versions.
  - Agent jobs (Gate 5) need databricks-openai, which requires MLflow 3.10 or later,
    so they will need their own environment spec.
