notes:
- 'Schedule 85''s July 8, 2026 revision moved energy pricing to Schedule 125 and removed the energy period
  footnote; Schedule 125 lists on-, mid-, and off-peak rates without restating hours. Periods use the
  most recent published definition (Third Revision of Sheet 85-1, effective January 1, 2026): on-peak
  Monday-Saturday 4-10 p.m., mid-peak Monday-Saturday 6 a.m.-4 p.m., off-peak Monday-Saturday 10 p.m.-6
  a.m. and all day Sunday.'
- Peak Demand hours are Monday-Saturday 6 a.m.-10 p.m. (Sheet 85-1). PGE measures Demand over 30 minute
  intervals (Rule B); this project bills hourly mean kW.
- Facility Capacity is the average of the two greatest non-zero monthly Demands in the 12 months ending
  with the current billing period (Rule B).
- Schedule 109 rate is the 85/485/585 secondary line, not the >1 aMW line; MT_189 averages below 1 aMW.
- Schedule 115 caps the charge at $1,000 per month per site; MT_189's monthly kWh keeps it below the cap
  (checked at Gate 3).
- 'Schedule 126 footnote (2) excludes customers served the entire calendar year in which the variance
  accrued; Schedule 100 applies that exclusion only to 5xx schedules, so it is included here (conservative:
  more cost).'
