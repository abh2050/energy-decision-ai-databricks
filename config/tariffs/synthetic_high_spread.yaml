# Stress case (FR6). SYNTHETIC: B-19 with off-peak held fixed in both seasons, and the
# peak and part-peak gaps to off-peak multiplied by m. Super off-peak, demand charges,
# periods, and exclusions are B-19's. One tariff per multiplier:
# synthetic_high_spread_m1, _m1_5, _m2, _m3.
id_prefix: synthetic_high_spread
role: stress
synthetic: true
derived_from: anchored_tou.yaml
widened_periods: [peak, part_peak]
reference_period: off_peak
gap_multipliers: [1.0, 1.5, 2.0, 3.0]
assumption: >-
  SYNTHETIC: in summer and winter, peak = off_peak + m x (peak - off_peak) and part_peak =
  off_peak + m x (part_peak - off_peak), using B-19 rates; off-peak and super off-peak
  unchanged. Not a published rate; owner-specified sweep for stress testing.
