# Stress case (FR6). SYNTHETIC: B-19 with off-peak held fixed and the summer peak to
# off-peak gap multiplied; every other rate, period, and demand charge is B-19's.
# One tariff per multiplier: synthetic_high_spread_m1, _m1_5, _m2, _m3.
id_prefix: synthetic_high_spread
role: stress
synthetic: true
derived_from: anchored_tou.yaml
season: summer
peak_period: peak
reference_period: off_peak
gap_multipliers: [1.0, 1.5, 2.0, 3.0]
assumption: >-
  SYNTHETIC: summer peak energy = B-19 summer off-peak + m x (B-19 summer peak - B-19
  summer off-peak). Not a published rate; owner-specified sweep for stress testing.
