# Primary anchored tariff (FR6): PG&E B-19, secondary voltage. Every rate is copied from
# the official PDF in `sources`; its SHA256 identifies the exact copy that was read.
# Rule: include every per kWh and per kW charge; exclude only fixed monthly customer
# charges and percentage taxes or franchise fees.
id: pge_b19_secondary
role: anchored
synthetic: false
utility: Pacific Gas and Electric Company (PG&E)
schedule: Electric Schedule B-19, Medium General Demand-Metered TOU Service
voltage: secondary
eligibility: >-
  Mandatory when maximum billing demand (15 minute) exceeds 499 kW for three consecutive
  months in the last 12 and the customer does not meet Schedule B-20 requirements.
clock: Europe/Lisbon
sources:
  - id: b19_rates
    title: PG&E Electric Schedule B-19, Sheet 4, Total Bundled Time-of-Use Rates
    url: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_SCHEDS_B-19.pdf
    sha256: 0206afab90dc15a02573bae4e03fa80341d75fce87ee92e4c13d9a73842bc5d6
    sheet: Cal. P.U.C. Sheet No. 61071-E (cancelling 60650-E)
    advice_letter: 7846-E
    effective_date: 2026-03-01
    retrieved: 2026-10-14
  - id: b19_periods
    title: PG&E Electric Schedule B-19, Section 6, Definition of Time Periods
    url: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_SCHEDS_B-19.pdf
    sha256: 0206afab90dc15a02573bae4e03fa80341d75fce87ee92e4c13d9a73842bc5d6
    sheet: Cal. P.U.C. Sheet No. 57123-E (cancelling 49020-E)
    advice_letter: 7116-E-B
    effective_date: 2024-01-01
    retrieved: 2026-10-14
seasons:
  summer: [6, 7, 8, 9]  # June 1 through September 30
  winter: [10, 11, 12, 1, 2, 3, 4, 5]  # October 1 through May 31
default_period: off_peak  # "All other hours"
period_rules:
  - {season: summer, name: peak, hours: [[16, 21]]}  # 4:00 to 9:00 p.m. every day
  - {season: summer, name: part_peak, hours: [[14, 16], [21, 23]]}  # 2-4 p.m. and 9-11 p.m.
  - {season: winter, name: peak, hours: [[16, 21]]}
  - {season: winter, name: super_off_peak, hours: [[9, 14]], months: [3, 4, 5]}  # Mar-May
energy_components:
  - name: Total energy rate (bundled), secondary
    source: b19_rates
    by_period_usd_per_kwh:
      summer: {peak: 0.18648, part_peak: 0.14775, off_peak: 0.12037}
      winter: {peak: 0.16188, off_peak: 0.12026, super_off_peak: 0.06442}
demand_charges:  # Total Demand Rates ($ per kW), secondary, monthly
  - name: Maximum demand
    source: b19_rates
    rates_usd_per_kw: {summer: 37.37, winter: 37.37}
    tariff_interval_minutes: 15
  - name: Maximum peak demand
    source: b19_rates
    periods: [peak]
    rates_usd_per_kw: {summer: 46.16, winter: 2.31}
    tariff_interval_minutes: 15
  - name: Maximum part-peak demand
    source: b19_rates
    periods: [part_peak]
    rates_usd_per_kw: {summer: 10.52}
    tariff_interval_minutes: 15
excluded:
  - name: Customer charge, mandatory B-19 ($ per meter per day)
    source: b19_rates
    reason: fixed customer charge
  - name: Utility users taxes and franchise fees
    source: b19_rates
    reason: percentage taxes or franchise fees
not_modelled:
  - name: Peak Day Pricing event charges and credits
    source: b19_rates
    reason: >-
      Optional program (customers may opt out to the TOU rate); event days are not known
      for the load period. The TOU rate is used.
  - name: Power factor adjustment ($/kWh/%)
    source: b19_rates
    reason: per kWh charge that depends on power factor, which the load data does not contain
  - name: Standby and reservation charges
    source: b19_rates
    reason: apply only to customers with standby service; not applicable
notes:
  - >-
    The tariff measures demand on 15 minute averages; this project bills demand on hourly
    mean kW (FR3), which understates demand charges.
  - >-
    Billing months are local calendar months, so none spans the June 1 or October 1
    season change and no proration is needed.
