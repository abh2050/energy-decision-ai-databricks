# Databricks Apps entrypoint (Gate 6). Runs with Python 3.12 from the committed uv.lock.
command:
  - uv
  - run
  - --frozen
  - --no-dev
  - --extra
  - platform
  - --python
  - "3.12"
  - uvicorn
  - edip.api.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"
env:
  - name: EDIP_STORE
    value: lakebase
  - name: EDIP_MODEL
    value: fmapi
  - name: EDIP_DATA_VOLUME
    value: /Volumes/edip/ml/artifacts/app
  - name: EDIP_OPERATOR_HASHES
    valueFrom: operator-hashes
  - name: MLFLOW_TRACKING_URI
    value: databricks
  - name: MLFLOW_EXPERIMENT_NAME
    value: /Shared/edip/live_app
  - name: UV_PYTHON_PREFERENCE
    value: managed
