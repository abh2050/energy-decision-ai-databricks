# Databricks Asset Bundle for EDIP. The workspace host is never committed: it comes from
# the Databricks CLI profile (`--profile edip` or DATABRICKS_CONFIG_PROFILE).
bundle:
  name: edip

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all EDIP tables.
    default: edip
  fm_endpoint:
    description: Foundation Model API endpoint used by the agents.
    default: databricks-meta-llama-3-3-70b-instruct

artifacts:
  edip_wheel:
    type: whl
    build: uv build --wheel
    path: .

sync:
  exclude:
    - frontend/**
    - tests/**

targets:
  dev:
    default: true
    # No development mode: it prefixes schema names with the user name, and the PRD needs
    # exact names (raw/curated/ml/eval) in this single demo workspace. Jobs have no
    # schedules, so nothing runs unattended.
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
    presets:
      tags:
        project: edip
        env: dev
  prod:
    mode: production
    presets:
      tags:
        project: edip
        env: prod
